<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>camera — Of Tomorrow broadcast</title>
<!-- The magazine's two faces (src/components/Fonts.astro) and its tokens. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../src/styles/magazine.css" />
<link rel="stylesheet" href="broadcast.css" />
<script src="params.js"></script>
</head>
<!-- The frame (spec §2.1): transparent, the camera shows through. On in every scene. -->
<body>
<div class="bc-grain bc-grain--tl"></div>
<div class="bc-grain bc-grain--tr"></div>
<div class="bc-grain bc-grain--bl"></div>
<div class="bc-grain bc-grain--br"></div>
<div class="bc-rule"></div>
<header class="bc-masthead">
	<div class="bc-masthead-row">
		<p class="bc-nameplate">Of Tomorrow</p>
		<span class="bc-badge" id="badge"></span>
	</div>
	<p class="bc-issue" id="issue"></p>
</header>
<script>
	(function (B) {
		var p = B.params;
		B.apply(p);
		document.getElementById('badge').textContent = p.segment;
		document.getElementById('issue').textContent = B.issueLine(p);
	})(window.Broadcast);
</script>
</body>
</html>
