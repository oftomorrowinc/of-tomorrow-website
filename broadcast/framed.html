<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>framed — Of Tomorrow broadcast</title>
<!-- The magazine's two faces, as files (fonts/fonts.css), and its tokens. -->
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="../src/styles/magazine.css" />
<link rel="stylesheet" href="broadcast.css" />
<script src="params.js"></script>
</head>
<!-- The framed window (spec §2.4): a paper matte, a 1440×810 window where OBS
     places a media, browser or capture source, a caption beneath. tile=1 adds
     the camera tile and moves the window left to clear it. bw=1 (the b&w
     treatment) is card 3's; in lo-fi the media source carries OBS's own filter. -->
<body>
<div id="stage"></div>
<script>
	(function (B) {
		var stage = document.getElementById('stage');
		B.mount(function (p) {
			stage.replaceChildren();
			var win = { x: p.tile ? 96 : 240, y: 116, w: 1440, h: 810, r: 12 };
			var holes = [win];
			if (p.tile) holes.push(B.TILE);
			stage.appendChild(B.matte(holes));
			var w = B.el('div', 'bc-window');
			w.id = 'window';
			w.style.left = win.x + 'px';
			w.style.top = win.y + 'px';
			w.style.width = win.w + 'px';
			w.style.height = win.h + 'px';
			stage.appendChild(w);
			if (p.tile) stage.appendChild(B.tile());
			var cap = B.el('p', 'bc-caption', p.caption || p.title);
			cap.style.left = win.x + 'px';
			cap.style.width = win.w + 'px';
			cap.style.top = win.y + win.h + 22 + 'px';
			stage.appendChild(cap);
		});
	})(window.Broadcast);
</script>
</body>
</html>
