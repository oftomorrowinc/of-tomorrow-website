<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>full — Of Tomorrow broadcast</title>
<!-- The magazine's two faces, as files (fonts/fonts.css), and its tokens. -->
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="../src/styles/magazine.css" />
<link rel="stylesheet" href="broadcast.css" />
<script src="params.js"></script>
</head>
<!-- Full-screen title / list / progress (spec §2.3); tile=1 cuts the camera tile. -->
<body>
<div id="stage"></div>
<script>
	(function (B) {
		var stage = document.getElementById('stage');
		B.mount(function (p, prev) {
			stage.replaceChildren();
			document.documentElement.dataset.mode = p.mode;
			stage.appendChild(B.matte(p.tile ? [B.TILE] : []));
			if (p.tile) stage.appendChild(B.tile());

			if (p.mode === 'title') {
				var h = B.el('div', 'bc-headline');
				if (p.kicker) h.appendChild(B.el('p', 'bc-kicker', p.kicker));
				h.appendChild(B.el('h1', 'bc-headline-text', p.title));
				h.appendChild(B.el('div', 'bc-headline-rule'));
				stage.appendChild(h);
			} else if (p.mode === 'list') {
				// The split's copy block, unchanged, so the list stays put.
				var copy = B.el('div', 'bc-copy');
				copy.appendChild(B.el('p', 'bc-kicker', p.kicker || p.segment));
				if (p.title) copy.appendChild(B.el('h1', 'bc-title', p.title));
				copy.appendChild(B.list(p, prev));
				stage.appendChild(copy);
			} else {
				// The rule stops short of the tile when it is on.
				var right = p.tile ? 1920 - B.TILE.x + 40 : 200;
				var width = 1920 - 200 - right;
				var prog = B.el('div', 'bc-progress');
				prog.style.width = width + 'px';
				var k = B.el('p', 'bc-kicker bc-progress-kicker', p.kicker || p.segment);
				prog.appendChild(k);
				if (p.title) {
					var t = B.el('h1', 'bc-title', p.title);
					t.style.position = 'absolute';
					t.style.top = '290px';
					t.style.whiteSpace = 'nowrap';
					prog.appendChild(t);
				}
				prog.appendChild(B.el('div', 'bc-progress-rule'));
				var n = p.steps.length;
				p.steps.forEach(function (text, i) {
					var state = i + 1 < p.now ? 'done' : i + 1 === p.now ? 'now' : 'next';
					var s = B.el('div', 'bc-step bc-step--' + state + ' bc-step--' + (i % 2 ? 'below' : 'above'));
					// The dock's now +: the step that just became current settles in.
					if (state === 'now' && prev && prev.now !== p.now) s.classList.add('bc-step--in');
					s.style.left = Math.round(((i + 0.5) * width) / n) + 'px';
					s.appendChild(B.el('div', 'bc-step-stem'));
					s.appendChild(B.el('div', 'bc-step-dot'));
					var label = B.el('div', 'bc-step-label');
					label.appendChild(B.el('span', 'bc-step-n', String(i + 1)));
					label.appendChild(B.el('span', 'bc-step-text', text));
					s.appendChild(label);
					prog.appendChild(s);
				});
				stage.appendChild(prog);
			}
		});
	})(window.Broadcast);
</script>
</body>
</html>
