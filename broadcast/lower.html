<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>lower — Of Tomorrow broadcast</title>
<!-- The magazine's two faces (src/components/Fonts.astro) and its tokens. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../src/styles/magazine.css" />
<link rel="stylesheet" href="broadcast.css" />
<script src="params.js"></script>
</head>
<!-- The lower-third (spec §2.5): a caption plate on the frame's bottom rule.
     Lo-fi: static; the 0.5 s slide-in and out=1's slide-away are card 2. -->
<body>
<aside class="bc-lower" id="plate">
	<div class="bc-lower-tab" id="tab"></div>
	<div class="bc-lower-copy">
		<p class="bc-lower-title" id="title"></p>
		<p class="bc-lower-sub" id="sub"></p>
	</div>
</aside>
<script>
	(function (B) {
		var p = B.params;
		// Mustard by default; accent= overrides (§2.5).
		B.apply(p, p.accentGiven ? p.accent : 'mustard');
		var tab = document.getElementById('tab');
		if (p.n) tab.textContent = 'No. ' + p.n;
		else tab.hidden = true;
		document.getElementById('title').textContent = p.title;
		var sub = document.getElementById('sub');
		if (p.sub) sub.textContent = p.sub;
		else sub.hidden = true;
		document.getElementById('plate').hidden = p.out;
	})(window.Broadcast);
</script>
</body>
</html>
