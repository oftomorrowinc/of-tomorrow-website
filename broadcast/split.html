<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>split — Of Tomorrow broadcast</title>
<!-- The magazine's two faces, as files (fonts/fonts.css), and its tokens. -->
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="../src/styles/magazine.css" />
<link rel="stylesheet" href="broadcast.css" />
<script src="params.js"></script>
</head>
<!-- The 45/55 split (spec §2.2): a paper panel on the left 45 %; the camera, in OBS, on the right 55 %; src= fills the list from JSON (card 4). -->
<body>
<section class="bc-panel">
	<div class="bc-halftone"></div>
</section>
<div class="bc-copy" id="copy"></div>
<script>
	(function (B) {
		var copy = document.getElementById('copy');
		B.mount(function (p, prev) {
			copy.replaceChildren(B.el('p', 'bc-kicker', p.kicker || p.segment));
			if (p.title) copy.appendChild(B.el('h1', 'bc-title', p.title));
			copy.appendChild(B.list(p, prev));
		}, { src: true });
	})(window.Broadcast);
</script>
</body>
</html>
