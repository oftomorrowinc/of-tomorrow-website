<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>split — Of Tomorrow broadcast</title>
<!-- The magazine's two faces (src/components/Fonts.astro) and its tokens. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../src/styles/magazine.css" />
<link rel="stylesheet" href="broadcast.css" />
<script src="params.js"></script>
</head>
<!-- The 45/55 split (spec §2.2): a paper panel on the left 45 %; the camera, in OBS, on the right 55 %. -->
<body>
<section class="bc-panel">
	<div class="bc-halftone"></div>
</section>
<div class="bc-copy" id="copy"></div>
<script>
	(function (B) {
		var p = B.params;
		B.apply(p);
		var copy = document.getElementById('copy');
		copy.appendChild(B.el('p', 'bc-kicker', p.kicker || p.segment));
		if (p.title) copy.appendChild(B.el('h1', 'bc-title', p.title));
		copy.appendChild(B.list(p));
	})(window.Broadcast);
</script>
</body>
</html>
