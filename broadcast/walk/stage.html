<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>stage — a stand-in for OBS, for the walk (not a browser source)</title>
<!-- What OBS does with the pages, done in a browser so a walk can be recorded
     without OBS: four scenes, each a camera stand-in under its page, cross-
     faded in 300 ms (Studio Mode → Fade); camera.html and lower.html above
     every scene; the real dock.html beside the program. The pages are the
     real ones, in iframes at 1920×1080, talking to the dock through storage
     as they do in OBS. broadcast/walk/walk.mjs drives it. -->
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="../../src/styles/magazine.css" />
<style>
	html, body { margin: 0; width: 2320px; height: 1080px; overflow: hidden; background: var(--ink); }
	#program { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
	#side { position: absolute; left: 1920px; top: 0; width: 400px; height: 1080px; }
	#dock { width: 400px; height: 1020px; border: 0; display: block; }
	#obs {
		height: 60px; box-sizing: border-box; padding: 10px 14px; background: var(--ink); color: var(--paper);
		font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase;
	}
	#obs small { display: block; color: var(--caption); font-family: var(--font-serif); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 13px; }
	iframe.page { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: transparent; }
	.scene { position: absolute; inset: 0; opacity: 0; transition: opacity 300ms linear; }
	.scene.on { opacity: 1; }

	/* The camera stand-in: no footage, a figure in the right third, the
	   room in the magazine's darks — enough to see where the face goes. */
	.cam { position: absolute; overflow: hidden; background: radial-gradient(ellipse at 70% 40%, var(--body-muted), var(--ink) 75%); }
	.cam .who { position: absolute; left: 66.6%; top: 50%; width: 0; height: 0; }
	.cam .head { position: absolute; left: -95px; top: -250px; width: 190px; height: 230px; border-radius: 50%; background: var(--caption); }
	.cam .body { position: absolute; left: -230px; top: -10px; width: 460px; height: 700px; border-radius: 230px 230px 0 0; background: var(--caption); }
	.cam .tag { position: absolute; right: 40px; top: 40px; color: var(--caption); font: 700 20px var(--font-display); letter-spacing: 0.2em; text-transform: uppercase; }
	/* Full frame; the split's right 55 %, zoomed; the tile, the zoomed shot cropped to 5:7. */
	#scene-camera .cam { inset: 0; }
	#scene-split .cam { left: 864px; top: 0; width: 1056px; height: 1080px; }
	#scene-split .cam .who { left: 50%; top: 52%; transform: scale(1.3); }
	#scene-full .cam, #scene-framed .cam { left: 1548px; top: 588px; width: 300px; height: 420px; }
	#scene-full .cam .who, #scene-framed .cam .who { left: 50%; top: 48%; transform: scale(0.55); }
	.cam-tile .tag { display: none; }
	/* The framed window's media: an "archive clip" in greys. */
	.media { position: absolute; left: 96px; top: 116px; width: 1440px; height: 810px; overflow: hidden;
		background: repeating-linear-gradient(115deg, var(--caption) 0 60px, var(--body-muted) 60px 120px); filter: grayscale(1); }
	.media p { position: absolute; left: 0; right: 0; top: 46%; margin: 0; text-align: center; color: var(--paper); font: 900 64px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="program">
	<section class="scene on" id="scene-camera">
		<div class="cam"><div class="who"><div class="head"></div><div class="body"></div></div><span class="tag">Camera</span></div>
	</section>
	<section class="scene" id="scene-split">
		<div class="cam"><div class="who"><div class="head"></div><div class="body"></div></div><span class="tag">Camera · zoom</span></div>
		<iframe class="page" data-src="split.html"></iframe>
	</section>
	<section class="scene" id="scene-full">
		<div class="cam cam-tile"><div class="who"><div class="head"></div><div class="body"></div></div><span class="tag"></span></div>
		<iframe class="page" data-src="full.html?mode=list&amp;tile=1"></iframe>
	</section>
	<section class="scene" id="scene-framed">
		<div class="media"><p>From the archive</p></div>
		<div class="cam cam-tile"><div class="who"><div class="head"></div><div class="body"></div></div><span class="tag"></span></div>
		<iframe class="page" data-src="framed.html?tile=1&amp;caption=From%20the%20archive%20%C2%B7%202024"></iframe>
	</section>
	<!-- On top of every scene, as in the README's table. -->
	<iframe class="page" id="frame" data-src="camera.html"></iframe>
	<iframe class="page" id="lower" data-src="lower.html?out=1"></iframe>
</div>
<div id="side">
	<div id="obs">OBS · Camera<small>The scene is OBS's; everything on it comes from the dock.</small></div>
	<iframe id="dock" data-src="dock.html"></iframe>
</div>
<script>
	// The common params each source's URL carries in the README's setup.
	var COMMON = 'issue=12&date=2026-11-04&segment=Field%20Notes';
	document.querySelectorAll('iframe[data-src]').forEach(function (f) {
		var src = f.dataset.src;
		f.src = '../' + src + (f.id === 'dock' ? '' : (src.indexOf('?') < 0 ? '?' : '&') + COMMON);
	});
	window.scene = function (name, label) {
		document.querySelectorAll('.scene').forEach(function (s) { s.classList.toggle('on', s.id === 'scene-' + name); });
		document.getElementById('obs').firstChild.textContent = 'OBS · ' + label;
	};
</script>
</body>
</html>
